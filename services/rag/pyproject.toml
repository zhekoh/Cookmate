[project]
name = "cookmate-rag"
version = "0.1.0"
description = "Cited cooking Q&A for Cookmate: retrieval over open-licensed sources."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    # Postgres driver. The binary extra ships libpq inside the wheel, so
    # neither a Mac nor the slim Docker image needs Postgres libraries installed.
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2",        # FastAPI's TestClient is built on it
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

# ---- ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes and pycodestyle. I: import order. B: likely bugs.
# UP: modern syntax for the pinned Python. S: security (hard-coded secrets,
# unsafe calls). RUF: ruff's own checks.
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; S101 would flag every test.
"tests/**" = ["S101"]

# ---- mypy ----
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
